<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oi&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

</head>
<body>


<nav class="navbar bg-body-tertiary rounded mb-3" aria-label="Simple navbar">
  <div class="container">

    <a class="navbar-brand mx-auto" id="logo" href="#">Kino</a>

    <button class="btn btn-outline-danger" type="button" id="logout-btn">
      Log out
    </button>
  </div>

</nav>
<template id="movie-template">
  <div class="border rounded-3 p-4 mb-4 shadow-sm" data-movie-id="">
    <div class="row g-4">
      <div class="col-md-3">
        <div class="movie-poster-container">
          <img class="img-fluid rounded-3 movie-poster" alt="Filmplakat">
          <div class="movie-info-overlay">
            <p><strong>Genre:</strong> <span class="movie-genre"></span></p>
            <p><strong>Duration:</strong> <span class="movie-duration"></span></p>
            <p><strong>Age limit:</strong> <span class="movie-age-limit"></span></p>
            <p><strong>Release date:</strong> <span class="movie-release-date"></span></p>
            <hr>
            <p><strong>Description:</strong><br><span class="movie-description"></span></p>
            <hr>
            <p><strong>Actors:</strong><br><span class="movie-actors"></span></p>
          </div>
        </div>
      </div>
      <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="movie-title mb-0"></h2>
          <button class="btn btn-primary btn-sm edit-movie-btn" data-bs-toggle="modal" data-bs-target="#editMovieModal">
            Edit movie
          </button>
        </div>
        <p class="text-muted">
          <span>Duration: <span class="movie-duration-text"></span></span>
          <span class="mx-2">|</span> <span>Age limit: <span class="movie-age-limit-text"></span></span>
        </p>
        <hr class="my-4">
        <div class="row movie-showtimes-container">
        </div>
      </div>
    </div>
  </div>
</template>

<div class="d-flex justify-content-center" id="weekSelector">
  <div class="d-flex align-items-center mb-3 gap-3">

    <button class="btn btn-link text-secondary btn-sm week-next-btn" id="pastWeek">&lt; Forrige Uge</button>

    <h5 class="m-0 week-display-text text-nowrap" id="currentWeek">(DD/MM - DD/MM)</h5>

    <button class="btn btn-link text-secondary btn-sm week-next-btn" id="comingWeek">Næste Uge &gt;</button>
  </div>
</div>
<div class="container my-5" id="movie-container">
</div>

<div class="modal fade" id="editMovieModal" tabindex="-1" aria-labelledby="editMovieModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editMovieModalLabel">Rediger Film: <span id="modal-movie-title"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editMovieForm">
          <input type="hidden" id="edit-movie-id" name="movie_id">

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="edit-title" class="form-label">Titel</label>
              <input type="text" class="form-control" id="edit-title" name="title" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="edit-poster-url" class="form-label">Poster URL</label>
              <input type="url" class="form-control" id="edit-poster-url" name="poster_url" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="edit-description" class="form-label">Beskrivelse</label>
            <textarea class="form-control" id="edit-description" name="description" rows="3" required></textarea>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="edit-duration-minutes" class="form-label">Varighed (minutter)</label>
              <input type="number" class="form-control" id="edit-duration-minutes" name="duration_minutes" required>
            </div>
            <div class="col-md-4 mb-3">
              <label for="edit-age-rating" class="form-label">Aldersgrænse</label>
              <input type="number" class="form-control" id="edit-age-rating" name="age_rating" required>
            </div>
            <div class="col-md-4 mb-3">
              <label for="edit-genre" class="form-label">Genre</label>
              <input type="text" class="form-control" id="edit-genre" name="genre" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="edit-actors" class="form-label">Skuespillere</label>
              <input type="text" class="form-control" id="edit-actors" name="actors" placeholder="Adskil med komma" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="edit-published-date" class="form-label">Udgivelsesdato</label>
              <input type="date" class="form-control" id="edit-published-date" name="published_date" required>
            </div>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Luk</button>
        <button type="submit" form="editMovieForm" class="btn btn-danger" id="save-movie-btn">Gem Ændringer</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js" type="module"></script>


</body>

</html>
